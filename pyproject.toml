[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "listen-n-speak"
version = "0.1.0"
description = "MCP server giving agents ears and a mouth: transcription, synthesis, and a human-in-the-loop listen dialog"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2",
    "httpx>=0.27",
]

[project.scripts]
listen-n-speak = "listen_n_speak.server:main"

[project.optional-dependencies]
# Local STT (faster-whisper/CTranslate2). Required for the listen dialog's
# live typing; numpy is used for chunked partial transcription.
stt = [
    "faster-whisper>=1.1",
    "numpy>=1.26",
]
# Local TTS (Piper) + the no-key cloud TTS route (Edge).
tts = [
    "piper-tts>=1.8",
    "edge-tts>=7",
]

[tool.setuptools.packages.find]
where = ["src"]
